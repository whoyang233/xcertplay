name: Android Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_unsigned:
        description: "Build unsigned inputs for first-time offline signing (not installable APKs)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed personal signing key
        id: signing
        env:
          PERSONAL_ANDROID_SIGNING: ${{ secrets.PERSONAL_ANDROID_SIGNING }}
          ALLOW_UNSIGNED_BOOTSTRAP: ${{ (github.event_name == 'workflow_dispatch' && inputs.bootstrap_unsigned) || github.event_name == 'pull_request' }}
        run: python3 ci/prepare-personal-signing.py

      - name: Test, lint, and build personal mobile APK
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :common:testDebugUnitTest
          :common:lintDebug
          :mobile:lintDebug
          :mobile:assembleDebug
          $UNSIGNED_BUILD_ARGUMENT
          --stacktrace

      - name: Verify personal package and signing identity
        run: python3 ci/verify-personal-apks.py

      - name: Upload personal mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact_prefix }}-${{ github.sha }}
          path: |
            mobile/build/outputs/apk/debug/*.apk
            personal-apk-verification.json
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            common/build/test-results/
            shared/build/test-results/
            common/build/reports/
            shared/build/reports/
            mobile/build/reports/
          if-no-files-found: ignore

  web-display-compatibility:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test the explicitly enabled optional web feature without packaging an APK
        run: ./gradlew :common:testDebugUnitTest -Pxcertplay.webDisplay=true --stacktrace
      - name: Upload optional feature reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-display-compatibility-reports-${{ github.sha }}
          path: |
            common/build/test-results/
            common/build/reports/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare fixed personal signing key
        env:
          PERSONAL_ANDROID_SIGNING: ${{ secrets.PERSONAL_ANDROID_SIGNING }}
        run: python3 ci/prepare-personal-signing.py

      - name: Test, lint, and build signed mobile release APK
        run: >-
          ./gradlew
          :shared:testDebugUnitTest
          :common:lintRelease
          :mobile:lintRelease
          :mobile:assembleRelease
          --stacktrace

      - name: Verify and collect signed APKs
        run: |
          set -euo pipefail

          mkdir -p release
          safe_tag="${GITHUB_REF_NAME//\//-}"
          mobile_apk="$(find mobile/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "${mobile_apk}"

          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          expected_cert="$(tr -d '\r\n' < signing/personal-certificate.sha256)"
          for apk in "${mobile_apk}"; do
            signer_info="$("${apksigner}" verify --verbose --print-certs "${apk}")"
            actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "${signer_info}")"
            test "${actual_cert,,}" = "${expected_cert,,}"
          done

          cp "${mobile_apk}" "release/xcertplay-mobile-${safe_tag}.apk"

      - name: Upload APKs to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" release/*.apk --clobber
